name: hero-seo-sync-temp

on:
  push:
    branches:
      - feat/hero-micro-smile-20260829

permissions:
  contents: read

concurrency:
  group: hero-seo-sync-temp
  cancel-in-progress: true

jobs:
  diagnose-generated-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run guard exactly as quality gate
        run: npm run guard

      - name: Snapshot deterministic SEO artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seo-before/js
          cp sitemap.xml /tmp/seo-before/
          cp sitemap-pages.xml /tmp/seo-before/
          cp sitemap-categories.xml /tmp/seo-before/
          cp sitemap-products.xml /tmp/seo-before/
          cp llms.txt /tmp/seo-before/
          cp llms-full.txt /tmp/seo-before/
          cp js/seo-route-map.js /tmp/seo-before/js/

      - name: Regenerate SEO exactly as quality gate
        run: npm run seo:generate

      - name: Print deterministic deltas
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for f in sitemap.xml sitemap-pages.xml sitemap-categories.xml sitemap-products.xml llms.txt llms-full.txt; do
            if ! cmp --silent "/tmp/seo-before/$f" "$f"; then
              echo "::error title=SEO deterministic delta::$f changed after regeneration"
              diff -u "/tmp/seo-before/$f" "$f" | head -120 || true
              failed=1
            else
              echo "STABLE=$f"
            fi
          done
          if ! cmp --silent /tmp/seo-before/js/seo-route-map.js js/seo-route-map.js; then
            echo "::error title=SEO deterministic delta::js/seo-route-map.js changed after regeneration"
            diff -u /tmp/seo-before/js/seo-route-map.js js/seo-route-map.js | head -120 || true
            failed=1
          else
            echo "STABLE=js/seo-route-map.js"
          fi
          exit "$failed"
