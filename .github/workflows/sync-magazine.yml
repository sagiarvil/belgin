# ==========================================================
# BELGİN SAAT — MAGAZİN OTOMATİK SENKRONİZASYON & SEO CRON
# ==========================================================
# Her 4 saatte bir 7/24 çalışır.
# Chrono24 first-party RSS yeni içerik kontratıdır.
# Full article extraction GitHub shared runner'dan yapılmaz; Belgin Cloud Function kullanılır.
# Full-body erişim 403 ile engellenirse, yalnız yeterli first-party RSS kanıtıyla özgün Belgin
# editoryal fallback devreye girer. Güvenlik/SEO kapıları sonrası git'e kaydedilir ve canlıya alınır.
# Fail-closed + self-healing: RSS -> cloud/full or RSS/editorial -> transform -> static -> sitemap -> live.
# Sessiz "yeni haber yok" başarısı yasaktır.
# ==========================================================

name: Magazine Live Editorial Sync (Every 4 Hours)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-magazine.yml'
      - 'scripts/sync-magazine-articles.py'
      - 'scripts/magazine_upstream_contract.py'
      - 'scripts/repair_magazine_expected_articles.py'
      - 'scripts/firebase-function-scope.mjs'
      - 'functions/magazine-fetch.js'
      - 'functions/bootstrap.js'
      - 'tests/test_magazine_upstream_contract.py'

concurrency:
  group: sync-magazine
  # A newer run re-evaluates the same first-party RSS against newer main, so stale runs are unsafe.
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  sync-magazine:
    name: Sync Horology Articles, Compile SEO & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: carbon-web-1265b
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      MAGAZINE_EXTRACTOR_URL: https://us-central1-carbon-web-1265b.cloudfunctions.net/magazineFetchArticle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Two commits are sufficient for push-diff detection; pull/rebase fetches origin/main explicitly.
          fetch-depth: 2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Magazine Freshness Contract
        run: python3 -m unittest tests/test_magazine_upstream_contract.py

      - name: Verify Chrono24 RSS & Capture Expected Articles
        run: python3 scripts/magazine_upstream_contract.py pre

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Resolve isolated extractor deployment need
        shell: bash
        run: |
          set -euo pipefail
          needs=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            needs=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD || true)"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq '^(functions/magazine-fetch\.js|functions/bootstrap\.js|scripts/firebase-function-scope\.mjs)$'; then
              needs=true
            fi
          fi
          echo "NEEDS_EXTRACTOR_DEPLOY=$needs" >> "$GITHUB_ENV"
          echo "MAGAZINE_EXTRACTOR_DEPLOY_NEEDED=$needs"

      - name: Authenticate extractor deploy with Google service account
        if: env.NEEDS_EXTRACTOR_DEPLOY == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}

      - name: Deploy/Refresh Isolated Magazine Extractor
        if: env.NEEDS_EXTRACTOR_DEPLOY == 'true'
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only functions:magazineFetchArticle --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only functions:magazineFetchArticle --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::error title=Magazine Extractor Deploy Blocked::Firebase deployment credential missing."
            exit 1
          fi

      - name: Run Primary Magazine Sync Engine
        run: python3 scripts/sync-magazine-articles.py

      - name: Self-Heal Independently Discovered Missing Articles
        run: python3 scripts/repair_magazine_expected_articles.py

      - name: Run Quality Gate & Compliance Guard
        run: |
          node scripts/magazine-safety-filter.js
          node scripts/sanitize-public-magazine-provenance.js
          npm test
          npm run guard

      - name: Verify Imported Article Contract
        run: python3 scripts/magazine_upstream_contract.py post

      - name: Commit updated magazine data & SEO pages
        run: |
          set -euo pipefail
          git config --global user.name "Belgin Magazine Bot"
          git config --global user.email "bot@belginkuyumculuk.com"
          git add -A js/magazine_data.js images/magazine/ magazin/ sitemap-magazine.xml sitemap.xml llms.txt llms-full.txt robots.txt firebase.json legal-manifest.json functions/legal-manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(magazine): automated horology article sync & static SEO compilation"

            # npm/build gates intentionally regenerate unrelated derived files. They are not part of
            # the magazine publication transaction and must never block pull --rebase or leak into it.
            git reset --hard HEAD

            PUSHED=false
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                PUSHED=true
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              echo "Push contention detected; retrying clean rebase in 3s... (attempt $i)"
              sleep 3
            done
            if [ "$PUSHED" != "true" ]; then
              echo "::error title=Magazine Git Push Failed::Generated magazine changes could not be pushed after 5 clean rebase attempts."
              exit 1
            fi
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          else
            echo "No new magazine articles or changes detected."
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          fi

      - name: Authenticate hosting deploy with Google service account
        if: (env.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch') && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}

      - name: Deploy to Firebase Hosting (only if new articles or manual trigger)
        if: env.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          node scripts/ensure-index-canonical-redirect.mjs
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "Deploying to Firebase Hosting via Google Service Account..."
            npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploying to Firebase Hosting via Firebase Token..."
            npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::error title=Missing Credentials::Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN is available."
            exit 1
          fi

      - name: Verify Live Magazine Contract
        if: env.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 scripts/magazine_upstream_contract.py live
