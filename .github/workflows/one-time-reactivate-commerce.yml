name: one-time-reactivate-commerce

on:
  push:
    paths:
      - '.github/workflows/one-time-reactivate-commerce.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reactivate jewellery and live prices in static HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('index.html'),
              Path('mucevherat/index.html'),
              Path('canli-fiyatlar/index.html'),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Desktop Mücevherat dropdown: remove the legacy inline hide flag.
              text = text.replace(
                  '<li class="nav-has-dropdown" style="display:none;">',
                  '<li class="nav-has-dropdown">'
              )

              # Desktop Canlı Fiyatlar link: remove the legacy inline hide flag.
              text = re.sub(
                  r'<li style="display:none;">\s*(<a href="/canli-fiyatlar/"[^>]*>)',
                  r'<li>\n          \1',
                  text
              )

              # Mobile Canlı Fiyatlar entry: keep styling, remove only display:none.
              text = text.replace(
                  'style="display:none; color:var(--color-teal);',
                  'style="color:var(--color-teal);'
              )

              # Mobile Mücevherat accordion wrapper: unhide only the wrapper that owns the jewellery button.
              text = re.sub(
                  r'(<\!-- 3\. Mücevherat Akordeon \(GİZLİ\) -->\s*)<div style="display:none;">',
                  r'\1<div>',
                  text
              )

              # Mobile bottom dock Mücevherat item: unhide only the jewellery link.
              text = re.sub(
                  r'(<a[^>]*data-page="mucevherat"[^>]*?)\sstyle="display:none;"',
                  r'\1',
                  text
              )

              # SPA sections stay controlled by .page/.active CSS; remove only legacy inline blockers.
              text = re.sub(
                  r'(<section id="page-(?:mucevherat|canli-fiyatlar)" class="page") style="display:none !important;"',
                  r'\1',
                  text
              )

              # Standalone live-prices page must not redirect back to home on hard load/refresh.
              if path.as_posix() == 'canli-fiyatlar/index.html':
                  text = text.replace("  <script>window.location.replace('/');</script>\n", '')
                  text = text.replace("<script>window.location.replace('/');</script>\n", '')

              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Verify target visibility
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-page="mucevherat"' index.html
          grep -q 'data-page="canli-fiyatlar"' index.html
          ! grep -A2 -B1 'href="/mucevherat/" data-page="mucevherat" class="nav-link-main"' index.html | grep -q 'display:none'
          ! grep -A2 -B1 'href="/canli-fiyatlar/" data-page="canli-fiyatlar" class="nav-link-main' index.html | grep -q 'display:none'
          ! grep -q "window.location.replace('/')" canli-fiyatlar/index.html

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sagi arvil'
          git config user.email 'teb232@gmail.com'
          git rm .github/workflows/one-time-reactivate-commerce.yml
          git add index.html mucevherat/index.html canli-fiyatlar/index.html
          git commit -m 'fix(nav): expose jewellery and live prices in static headers'
          git push origin HEAD:main
