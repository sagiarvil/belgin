name: free-legal-timestamp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "js/legal-*.js"
      - "scripts/generate-legal-manifest.js"
      - "scripts/harden-legal-pages.js"
      - "scripts/harden-public-claims.js"
      - "legal-manifest.json"
  schedule:
    - cron: "21 3 * * *"

permissions:
  contents: write

concurrency:
  group: legal-free-timestamp
  cancel-in-progress: false

jobs:
  stamp-and-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenTimestamps client
        run: python -m pip install --disable-pip-version-check opentimestamps-client

      - name: Build deterministic legal manifest
        if: github.event_name != 'schedule'
        run: node scripts/generate-legal-manifest.js

      - name: Create free Bitcoin timestamp proof for legal evidence root
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legal-proofs
          ROOT_SHA="$(node -e "const m=require('./legal-manifest.json');if(!/^[a-f0-9]{64}$/.test(m.manifestRootSha256||''))process.exit(2);process.stdout.write(m.manifestRootSha256)")"
          ROOT_FILE="legal-proofs/legal-root-${ROOT_SHA}.txt"
          PROOF="${ROOT_FILE}.ots"
          printf '%s\n' "$ROOT_SHA" > "$ROOT_FILE"
          if [ ! -f "$PROOF" ]; then
            ots stamp "$ROOT_FILE"
          fi
          ots upgrade "$PROOF" || true
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./legal-manifest.json');
          const root=m.manifestRootSha256;
          const status={
            schema:'belgin-free-external-timestamp-v1',
            model:'OpenTimestamps/Bitcoin',
            manifestRootSha256:root,
            rootFile:`legal-root-${root}.txt`,
            proofFile:`legal-root-${root}.txt.ots`,
            submittedAt:new Date().toISOString(),
            status:'SUBMITTED_OR_UPGRADED',
            legalQualification:'Auxiliary technical existence/integrity proof; not a 5070 qualified electronic signature or ESHS timestamp.'
          };
          fs.writeFileSync('legal-proofs/status.json',JSON.stringify(status,null,2)+'\n');
          fs.writeFileSync('legal-proofs/latest-root-sha256.txt',root+'\n');
          NODE

      - name: Upgrade pending OpenTimestamps proofs
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          for proof in legal-proofs/*.ots; do
            echo "Upgrading $proof"
            ots upgrade "$proof" || true
          done

      - name: Commit proof material
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- legal-proofs && [ -z "$(git status --porcelain legal-proofs)" ]; then
            echo "No timestamp proof change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-proofs
          git commit -m "evidence: anchor legal root with OpenTimestamps [skip ci]"
          git push
