name: free-legal-timestamp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "js/legal-*.js"
      - "scripts/generate-legal-manifest.js"
      - "scripts/harden-legal-pages.js"
      - "scripts/harden-public-claims.js"
      - "legal-manifest.json"
  schedule:
    - cron: "21 3 * * *"

permissions:
  contents: write

concurrency:
  group: legal-free-timestamp
  cancel-in-progress: false

jobs:
  stamp-and-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenTimestamps client
        run: python -m pip install --disable-pip-version-check "opentimestamps-client==0.7.2"

      - name: Create free Bitcoin timestamp proof for current legal manifest
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test -f legal-manifest.json
          mkdir -p legal-proofs
          MANIFEST_SHA="$(sha256sum legal-manifest.json | awk '{print $1}')"
          SNAPSHOT="legal-proofs/legal-manifest-${MANIFEST_SHA}.json"
          PROOF="${SNAPSHOT}.ots"
          if [ ! -f "$SNAPSHOT" ]; then
            cp legal-manifest.json "$SNAPSHOT"
          fi
          if [ ! -f "$PROOF" ]; then
            ots stamp "$SNAPSHOT"
          fi
          ots upgrade "$PROOF" || true
          printf '%s\n' "$MANIFEST_SHA" > legal-proofs/latest-manifest-sha256.txt

      - name: Upgrade pending OpenTimestamps proofs
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          for proof in legal-proofs/*.ots; do
            echo "Upgrading $proof"
            ots upgrade "$proof" || true
          done

      - name: Commit proof material
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- legal-proofs && [ -z "$(git status --porcelain legal-proofs)" ]; then
            echo "No timestamp proof change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-proofs
          git commit -m "evidence: anchor legal manifest with OpenTimestamps [skip ci]"
          git push
