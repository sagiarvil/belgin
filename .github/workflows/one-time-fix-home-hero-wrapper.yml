name: one-time-fix-home-hero-wrapper

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-home-hero-wrapper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove orphan wrapper before hero
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''  <section id="page-ana-sayfa" class="page active">\n    </div>\n    \n    <!-- BELGIN SIGNATURE MAISON HERO -->'''
          new = '''  <section id="page-ana-sayfa" class="page active">\n    \n    <!-- BELGIN SIGNATURE MAISON HERO -->'''
          if old not in text:
              raise SystemExit('Expected orphan hero wrapper sequence not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sagi arvil'
          git config user.email 'teb232@gmail.com'
          git rm .github/workflows/one-time-fix-home-hero-wrapper.yml
          git add index.html
          git commit -m 'fix(home): repair hero wrapper after verification move'
          git push origin HEAD:main
