name: deploy-production

on:
  workflow_run:
    workflows: ["quality-gates"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: belgin-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: carbon-web-1265b
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout audited main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve audited release SHA
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test -n "$sha"
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          printf '{"commit":"%s","source":"github-main"}\n' "$sha" > release.json
          echo "RELEASE_PROVENANCE_PREPARED=$sha"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Re-run production gates
        run: npm run ci

      - name: Validate canonical redirect patch
        run: node scripts/ensure-index-canonical-redirect.mjs --dry-run

      - name: Apply canonical redirect patch to deploy config
        run: node scripts/ensure-index-canonical-redirect.mjs

      - name: Verify Firebase target contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const cfg=require('./firebase.json');
          if(cfg.hosting?.site!=='belgin') throw new Error('Unexpected Firebase hosting target');
          const required=['createPayTRToken','paytrCallback','getOrderStatus'];
          const rewrites=cfg.hosting?.rewrites||[];
          for(const fn of required) if(!rewrites.some(r=>r.function===fn)) throw new Error(`Missing rewrite: ${fn}`);
          const indexRedirects=(cfg.hosting?.redirects||[]).filter(r=>r.source==='/index.html');
          if(indexRedirects.length!==1 || indexRedirects[0].destination!=='/' || Number(indexRedirects[0].type)!==301) {
            throw new Error('Missing exact /index.html -> / 301 canonical redirect');
          }
          console.log('FIREBASE_CONTRACT=PASS index.html->/ 301');
          NODE

      - name: Resolve Belgin Firebase function deploy scope
        shell: bash
        run: |
          set -euo pipefail
          scope="$(node scripts/firebase-function-scope.mjs)"
          test -n "$scope"
          echo "FIREBASE_FUNCTION_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "BELGIN_FUNCTION_SCOPE=PASS count=$(printf '%s' "$scope" | tr ',' '\n' | wc -l)"

      - name: Require deployment credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ] && [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error title=Firebase deployment credential missing::"
            echo "Neither FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B nor FIREBASE_TOKEN is configured."
            echo "Production deployment is blocked intentionally."
            exit 1
          fi

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "DEPLOY_AUTH=service-account"
          else
            echo "DEPLOY_AUTH=legacy-token"
          fi

      - name: Authenticate with Google service account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}

      - name: Deploy Cloud Functions with service account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only "$FIREBASE_FUNCTION_SCOPE" --non-interactive

      - name: Deploy Hosting with service account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive

      - name: Deploy Cloud Functions with legacy token
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN != ''
        run: npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only "$FIREBASE_FUNCTION_SCOPE" --non-interactive --token "$FIREBASE_TOKEN"

      - name: Deploy Hosting with legacy token
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN != ''
        run: npx -y firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive --token "$FIREBASE_TOKEN"

      - name: Verify live production commit provenance
        shell: bash
        run: |
          set -euo pipefail
          live_sha="$(curl --fail --silent --show-error --max-time 30 https://www.belginkuyumculuk.com/release.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(String(j.commit||''))})")"
          if [ "$live_sha" != "$RELEASE_SHA" ]; then
            echo "LIVE_RELEASE_SHA_MISMATCH expected=$RELEASE_SHA actual=$live_sha"
            exit 1
          fi
          echo "LIVE_RELEASE_SHA=PASS $live_sha"

      - name: Live SEO smoke
        env:
          LIVE_BASE_URL: https://www.belginkuyumculuk.com
          SEO_SMOKE_SAMPLE: "20"
        run: node scripts/live-seo-smoke.js

      - name: Verify live index canonical redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --max-time 30 --head https://www.belginkuyumculuk.com/index.html)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[^ ]+ 301([[:space:]]|$)'
          location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,"",$2); print $2; exit}')"
          case "$location" in
            /|https://www.belginkuyumculuk.com/|https://belginkuyumculuk.com/) ;;
            *) echo "Unexpected index redirect location: $location"; exit 1 ;;
          esac
          echo 'INDEX_CANONICAL_REDIRECT=PASS'

      - name: Legacy Live smoke check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://belginkuyumculuk.com/ -o /tmp/index.html
          grep -q 'belgin' /tmp/index.html || grep -qi 'Belgin Kuyumculuk' /tmp/index.html
          curl --fail --silent --show-error --head --max-time 30 https://belginkuyumculuk.com/ | grep -i 'strict-transport-security:'
          echo 'LIVE_SMOKE=PASS'
