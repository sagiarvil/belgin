name: apply-imageless-product-cleanup

on:
  push:
    branches:
      - fix/remove-imageless-products
    paths:
      - scripts/remove-unreliable-image-products.js
      - .github/workflows/apply-imageless-product-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/remove-imageless-products
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove unreliable-image products
        run: node scripts/remove-unreliable-image-products.js

      - name: Regenerate derived assets
        run: npm run build

      - name: Verify removed IDs are absent
        run: |
          for id in 1 2 4 7 8; do
            if grep -q "id: $id," js/data.js; then
              echo "Product $id still exists"
              exit 1
            fi
          done
          node scripts/verify-product-catalog.js

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/data.js scripts/verify-product-catalog.js tests/test-suite.js functions/product-catalog.json sitemap.xml llms.txt llms-full.txt robots.txt
          git commit -m 'fix: remove products without reliable images'
          git push origin HEAD:fix/remove-imageless-products
