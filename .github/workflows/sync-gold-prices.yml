name: Unified Smart Diffing Live Sync (Every 5 Minutes)

on:
  schedule:
    # Runs every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-unified-catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smart-sync:
    name: Smart Diffing Catalog Sync (Watches +40% / Gold +2%)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Run Unified Smart Diffing Engine
        run: node scripts/smart-diff-sync.js

      - name: Run Catalog Guard & Tests
        run: npm test && npm run guard

      - name: Commit updated catalog & assets (only if Smart Diff detected changes)
        run: |
          git config --global user.name "Belgin Smart Sync Bot"
          git config --global user.email "bot@belginkuyumculuk.com"
          git add js/data.js functions/product-catalog.json sitemap.xml llms.txt llms-full.txt robots.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): automated smart-diff update (gold +2% / watches +40%)"
            git push origin HEAD:${{ github.ref }}
          else
            echo "Zero delta detected. No commit needed."
          fi

      - name: Deploy to Firebase Hosting & Functions (only if changes detected)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: carbon-web-1265b
        run: |
          if ! git diff HEAD~1 --quiet; then
            npx firebase-tools deploy --project carbon-web-1265b --only hosting,functions --token "${{ secrets.FIREBASE_TOKEN }}"
          else
            echo "Skipping deploy: zero changes."
          fi
