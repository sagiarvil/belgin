name: Gold & Jewellery Live Price & Stock Sync (Every 5 Minutes)

on:
  schedule:
    # Runs every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-gold-prices
  cancel-in-progress: true

jobs:
  sync-gold:
    name: Sync Live Gold Prices (+5% Margin) & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Gold Live Sync Engine (+5% Margin & Stock Verification)
        run: node scripts/sync-prices-and-stock.js

      - name: Run Catalog Guard & Tests
        run: npm test && npm run guard

      - name: Commit updated gold prices & assets (if changed)
        run: |
          git config --global user.name "Belgin Gold Sync Bot"
          git config --global user.email "bot@belginkuyumculuk.com"
          git add js/data.js functions/product-catalog.json sitemap.xml llms.txt llms-full.txt robots.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): automated live gold price update (+5% margin & stock sync)"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No gold price or stock changes detected in this cycle."
          fi

      - name: Deploy to Firebase Hosting & Functions (if credentials exist)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: carbon-web-1265b
        run: |
          npx firebase-tools deploy --project carbon-web-1265b --only hosting,functions --token "${{ secrets.FIREBASE_TOKEN }}"
