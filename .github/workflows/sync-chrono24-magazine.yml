name: Daily Chrono24 Magazine Sync

on:
  schedule:
    # Her gün Türkiye saati 01:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-magazine:
    name: Sync Chrono24 Magazine Articles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Run Daily Chrono24 Magazine Sync
        run: |
          python scripts/daily-chrono24-magazine-sync.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild Static Pages & Run Verification
        run: |
          npm ci || npm install
          npm run build
          npm test
          npm run guard

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in magazine articles."
          else
            git commit -m "chore(cron): sync latest chrono24 magazine articles [skip ci]"
            git push origin main
          fi
