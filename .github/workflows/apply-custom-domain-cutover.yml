name: apply-custom-domain-cutover

on:
  push:
    branches:
      - fix/custom-domain-cutover
    paths:
      - scripts/migrate-custom-domain.js
      - .github/workflows/apply-custom-domain-cutover.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/custom-domain-cutover
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply domain migration
        run: node scripts/migrate-custom-domain.js

      - name: Regenerate SEO assets
        run: npm run build

      - name: Verify primary domain cutover
        run: |
          grep -q 'https://belginkuyumculuk.com/' index.html
          grep -q "const BASE_URL = 'https://belginkuyumculuk.com'" scripts/generate-seo-assets.js
          grep -q 'https://belginkuyumculuk.com/#payment-success' functions/index.js
          grep -q 'Sitemap: https://belginkuyumculuk.com/sitemap.xml' robots.txt
          if grep -R --exclude-dir=.git --exclude='apply-custom-domain-cutover.yml' --exclude='migrate-custom-domain.js' 'https://belgin.web.app' index.html scripts functions robots.txt sitemap.xml llms.txt llms-full.txt *.html 2>/dev/null; then
            echo 'Old primary-domain references remain.'
            exit 1
          fi

      - name: Commit cutover
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: switch production URLs to belginkuyumculuk.com'
          git push origin HEAD:fix/custom-domain-cutover
