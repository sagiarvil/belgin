<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIP WhatsApp Ödeme Linki Oluşturucu | Belgin Kuyumculuk & Saat</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1412">
  <meta name="apple-mobile-web-app-title" content="Belgin Link">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="images/link-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/link-icon-180.png">
  <link rel="apple-touch-icon-precomposed" href="images/link-icon-180.png">
  <link rel="manifest" href="link.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A1412;
      --bg-radial: radial-gradient(120% 90% at 50% -10%, #16302B 0%, #0A1412 55%);
      --card-bg: #11211F;
      --card-bg-soft: #0E1D1B;
      --card-border: #223F3B;
      --card-border-soft: #1A322E;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-dim: #A98A2C;
      --teal-accent: #178370;
      --text: #F3F6F5;
      --text-muted: #8EAAA5;
      --text-faint: #5E7975;
      --input-bg: #0B1917;
      --input-border: #23433F;
      --input-border-focus: var(--gold);
      --success: #25D366;
      --danger: #E2685A;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-radial);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(18px + var(--safe-t)) 16px calc(110px + var(--safe-b));
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: 50%;
      width: 480px; height: 480px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(212,175,55,0.10) 0%, rgba(212,175,55,0) 65%);
      pointer-events: none;
      z-index: 0;
    }

    .header { text-align: center; padding: 6px 0 22px; position: relative; z-index: 1; }
    .crest {
      width: 68px; height: 68px; object-fit: contain; margin-bottom: 10px;
      filter: drop-shadow(0 4px 18px rgba(212,175,55,0.35));
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(14px, 4vw, 19px);
      letter-spacing: clamp(1px, 0.4vw, 2px);
      color: var(--gold-light);
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      margin: 0 auto;
    }
    .brand-sub {
      margin-top: 4px;
      font-size: 11.5px;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      text-transform: uppercase;
      font-weight: 600;
    }

    .container { max-width: 480px; width: 100%; margin: 0 auto; flex: 1; position: relative; z-index: 1; }

    .card {
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--card-bg-soft) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 18px 24px;
      box-shadow: 0 20px 50px -12px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border-soft);
    }
    .card-title .dot { color: var(--gold); }

    .field { margin-bottom: 16px; position: relative; }
    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 7px;
    }
    .field-label .req { color: var(--gold); }

    .input-shell {
      position: relative;
      border-radius: var(--radius-md);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .input-shell.focus {
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
    }
    .input-shell.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(226,104,90,0.12);
    }
    .form-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 15px 16px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      outline: none;
      font-family: inherit;
    }
    .form-input::placeholder { color: var(--text-faint); font-weight: 500; }

    .amount-shell { display: flex; align-items: center; }
    .currency-symbol {
      padding-left: 16px;
      color: var(--gold);
      font-weight: 800;
      font-size: 21px;
      user-select: none;
    }
    .amount-input {
      font-size: 23px;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 0.3px;
      padding-left: 8px;
    }
    .amount-words {
      min-height: 14px;
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 6px;
      padding-left: 2px;
      font-weight: 600;
    }

    .field-error {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--danger);
      margin-top: 7px;
      font-weight: 600;
    }
    .field-error.show { display: flex; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #E7C34F 0%, #C79A2E 55%, #A9821F 100%);
      color: #0A1412;
      border: none;
      padding: 17px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 10px 28px -6px rgba(212,175,55,0.45);
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.65; cursor: default; }
    .btn-submit .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(10,20,18,0.35);
      border-top-color: #0A1412;
      border-radius: 50%;
      display: none;
      animation: spin .7s linear infinite;
    }
    .btn-submit.loading .spinner { display: inline-block; }
    .btn-submit.loading .btn-label { opacity: 0.75; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULT */
    .result-section {
      display: none;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px dashed var(--card-border-soft);
      animation: rise .35s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .result-flag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.35);
      color: var(--success);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 6px 11px;
      border-radius: 30px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .result-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .result-box {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      font-size: 13px;
      color: var(--gold-light);
      word-break: break-all;
      margin-bottom: 18px;
      font-family: 'SFMono-Regular', Menlo, monospace;
      font-weight: 600;
    }

    .whatsapp-preview {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border-soft);
      border-radius: var(--radius-md);
      padding: 15px;
      font-size: 13.5px;
      line-height: 1.65;
      color: #CFE3DE;
      white-space: pre-wrap;
      font-family: inherit;
      margin-bottom: 18px;
      position: relative;
    }
    .whatsapp-preview::before {
      content: '💬 Önizleme';
      position: absolute;
      top: -9px; left: 12px;
      background: var(--card-bg-soft);
      padding: 0 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-whatsapp {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #29D96C 0%, #1FAE59 100%);
      color: #08170F;
      text-decoration: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 26px -6px rgba(37,211,102,0.45);
    }
    .btn-copy, .btn-copy-msg {
      background: var(--card-bg-soft);
      color: var(--gold-light);
      border: 1px solid var(--card-border-soft);
      padding: 14px 10px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color .15s ease, transform .1s ease;
    }
    .btn-copy:active, .btn-copy-msg:active { transform: scale(0.97); }
    .btn-copy.copied, .btn-copy-msg.copied {
      border-color: var(--success);
      color: var(--success);
    }
    .btn-test {
      grid-column: 1 / -1;
      background: transparent;
      color: var(--text-faint);
      border: 1px dashed var(--card-border-soft);
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .btn-reset {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
      font-weight: 600;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-faint);
      margin-top: 18px;
      letter-spacing: 0.3px;
    }

    .toast {
      position: fixed;
      bottom: calc(24px + var(--safe-b));
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--gold-light);
      color: #10201C;
      padding: 12px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 200;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="header">
    <img src="images/belgin-crest-b.png" alt="Belgin Emblemi" class="crest">
    <div class="brand-title">Belgin Kuyumculuk & Saat</div>
    <div class="brand-sub">VIP Ödeme Linki Paneli</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title"><span class="dot">✦</span> Ürün ve Fiyat Belirleme</div>

      <form id="linkForm" novalidate>
        <div class="field">
          <label class="field-label" for="productTitle">Ürün / Model Adı <span class="req">*</span></label>
          <div class="input-shell" id="titleShell">
            <input type="text" id="productTitle" class="form-input" placeholder="Örn: Rolex Submariner 41mm Date" autocomplete="off">
          </div>
          <div class="field-error" id="titleError">⚠ Lütfen ürün veya model adını giriniz.</div>
        </div>

        <div class="field">
          <label class="field-label" for="productAmount">Satış Tutarı (TL) <span class="req">*</span></label>
          <div class="input-shell amount-shell" id="amountShell">
            <span class="currency-symbol">₺</span>
            <input type="text" inputmode="numeric" id="productAmount" class="form-input amount-input" placeholder="45.000">
          </div>
          <div class="amount-words" id="amountWords"></div>
          <div class="field-error" id="amountError">⚠ Lütfen geçerli bir satış tutarı giriniz (min. ₺100).</div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span class="spinner"></span>
          <span class="btn-label">Ödeme Linkini Oluştur</span>
        </button>
      </form>

      <div id="resultSection" class="result-section">
        <div class="result-flag">✓ Link hazır</div>

        <div class="result-label">Müşteriye Gönderilecek Güvenli Kısa Link</div>
        <div id="generatedUrlText" class="result-box"></div>

        <div class="action-grid">
          <a id="btnWhatsApp" href="#" target="_blank" class="btn-whatsapp">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
            WhatsApp ile Gönder
          </a>
          <button type="button" id="btnCopy" class="btn-copy" style="grid-column: 1 / -1;">🔗 Linki Kopyala</button>
          <a id="btnTestLink" href="#" target="_blank" class="btn-test">👁️ Müşteri Ödeme Ekranını Önizle</a>
          <button type="button" id="btnReset" class="btn-reset">Yeni link oluştur</button>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast">Panoya kopyalandı!</div>

  <script src="/js/vip-payment.js?v=2.8.0"></script>
  <script>
    const form = document.getElementById('linkForm');
    const titleInput = document.getElementById('productTitle');
    const amountInput = document.getElementById('productAmount');
    const titleShell = document.getElementById('titleShell');
    const amountShell = document.getElementById('amountShell');
    const titleError = document.getElementById('titleError');
    const amountError = document.getElementById('amountError');
    const amountWords = document.getElementById('amountWords');
    const resultSection = document.getElementById('resultSection');
    const generatedUrlText = document.getElementById('generatedUrlText');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnWhatsApp = document.getElementById('btnWhatsApp');
    const btnCopy = document.getElementById('btnCopy');
    const btnTestLink = document.getElementById('btnTestLink');
    const btnReset = document.getElementById('btnReset');
    const toast = document.getElementById('toast');
    let currentUrl = '';
    let currentMsg = '';

    // --- focus/blur görsel geri bildirim ---
    function bindShell(input, shell) {
      input.addEventListener('focus', () => shell.classList.add('focus'));
      input.addEventListener('blur', () => shell.classList.remove('focus'));
    }
    bindShell(titleInput, titleShell);
    bindShell(amountInput, amountShell);

    // --- canlı TL binlik ayraç formatlama (raw değer dataset'te tutulur) ---
    function formatAmountInput() {
      const digitsOnly = amountInput.value.replace(/\D/g, '');
      amountInput.dataset.raw = digitsOnly;
      if (!digitsOnly) {
        amountInput.value = '';
        amountWords.textContent = '';
        return;
      }
      const num = parseInt(digitsOnly, 10);
      amountInput.value = num.toLocaleString('tr-TR');
      amountWords.textContent = num >= 1000 ? `₺${num.toLocaleString('tr-TR')} — yaklaşık ${Math.round(num/1000)}.000 TL` : '';
    }
    amountInput.addEventListener('input', formatAmountInput);

    function clearErrors() {
      titleShell.classList.remove('error');
      amountShell.classList.remove('error');
      titleError.classList.remove('show');
      amountError.classList.remove('show');
    }

    function handleGenerate() {
      clearErrors();
      const title = titleInput.value.trim();
      const amount = parseInt(amountInput.dataset.raw || '0', 10);

      let hasError = false;
      if (!title) {
        titleShell.classList.add('error');
        titleError.classList.add('show');
        hasError = true;
      }
      if (!amount || amount < 100) {
        amountShell.classList.add('error');
        amountError.classList.add('show');
        hasError = true;
      }
      if (hasError) {
        (title ? amountInput : titleInput).focus();
        return;
      }

      btnSubmit.classList.add('loading');
      btnSubmit.disabled = true;

      setTimeout(() => {
        const payload = {
          orderId: 'VIP-' + Math.floor(100000 + Math.random() * 900000),
          title,
          amount,
          createdAt: new Date().toISOString()
        };

        const origin = window.location.origin.includes('localhost') ? window.location.origin : 'https://www.belginkuyumculuk.com';
        currentUrl = VipEngine.buildVipUrl(payload, origin);
        currentMsg = VipEngine.buildWhatsAppMessageText(payload, currentUrl);

        generatedUrlText.textContent = currentUrl;
        btnWhatsApp.href = VipEngine.buildWhatsAppShareUrl(payload, currentUrl);
        btnTestLink.href = currentUrl;

        btnSubmit.classList.remove('loading');
        btnSubmit.disabled = false;

        resultSection.style.display = 'block';
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 380);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      handleGenerate();
    });

    btnReset.addEventListener('click', () => {
      form.reset();
      amountWords.textContent = '';
      resultSection.style.display = 'none';
      clearErrors();
      titleInput.focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    btnCopy.addEventListener('click', () => {
      if (!currentUrl) return;
      copyToClipboard(currentUrl, 'Kısa link panoya kopyalandı!', btnCopy);
    });

    function copyToClipboard(text, msg, btn) {
      const done = () => {
        showToast(msg);
        if (btn) {
          const original = btn.innerHTML;
          btn.classList.add('copied');
          btn.innerHTML = '✓ Kopyalandı';
          setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = original; }, 1600);
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function fallbackCopy(text, onDone) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        onDone();
      } catch (e) {
        prompt('Metni kopyalayınız:', text);
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
