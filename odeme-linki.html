<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP WhatsApp Ödeme Linki Oluşturucu | Belgin Kuyumculuk & Saat</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1412">
  <meta name="apple-mobile-web-app-title" content="Belgin Link">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="images/link-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/link-icon-180.png">
  <link rel="apple-touch-icon-precomposed" href="images/link-icon-180.png">
  <link rel="manifest" href="link.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A1412;
      --card-bg: #122220;
      --card-border: #1E3835;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --teal-accent: #178370;
      --text: #F0F4F3;
      --text-muted: #8EAAA5;
      --input-bg: #0B1917;
      --input-border: #23433F;
      --success: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 700;
    }
    .header-sub {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--gold);
    }
    .amount-wrapper {
      position: relative;
    }
    .currency-symbol {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-weight: 700;
      font-size: 20px;
    }
    .amount-input {
      padding-left: 40px;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold-light);
    }
    .badge-high-value {
      display: none;
      margin-top: 8px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.4;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37 0%, #B38F24 100%);
      color: #0A1412;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      box-shadow: 0 6px 20px rgba(212,175,55,0.3);
      transition: transform 0.1s;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .result-section {
      display: none;
      margin-top: 24px;
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
    }
    .result-box {
      background: #081210;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #A8C5BF;
      word-break: break-all;
      margin-bottom: 16px;
      font-family: monospace;
    }
    .action-btn-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .btn-whatsapp {
      background: #25D366;
      color: #FFFFFF;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
    }
    .btn-copy {
      background: #173832;
      color: var(--gold-light);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-test {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid #1E3835;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      display: block;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: #0A1412;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .toast.show { opacity: 1; }

  </style>
</head>
<body>

  <div class="header">
    <img src="images/belgin-crest-b.png" alt="Belgin Emblemi" style="width:84px; height:84px; object-fit:contain; margin-bottom:12px; filter: drop-shadow(0 4px 16px rgba(212,175,55,0.4));">
    <div class="brand-title">Belgin Kuyumculuk & Saat</div>
    <div class="header-sub">Showroom VIP Ödeme Linki Oluşturucu</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">
        <span>✨</span> Ürün ve Fiyat Belirleme Paneli
      </div>

      <form id="linkForm">
        <div class="form-group">
          <label class="form-label">Ürün / Model Adı *</label>
          <input type="text" id="productTitle" class="form-input" required placeholder="Örn: Rolex Submariner 41mm Date">
        </div>

        <div class="form-group">
          <label class="form-label">Satış Tutarı (TL) *</label>
          <div class="amount-wrapper">
            <span class="currency-symbol">₺</span>
            <input type="number" id="productAmount" class="form-input amount-input" required min="100" step="1" placeholder="45.000">
          </div>
        </div>



        <button type="submit" id="btnSubmit" class="btn-submit">
          <span>🔗</span> VIP Ödeme Linkini Oluştur
        </button>
      </form>

      <!-- ÇIKTI VE AKSİYONLAR -->
      <div id="resultSection" class="result-section">
        <div class="form-label">Müşteriye Gönderilecek Güvenli Link:</div>
        <div id="generatedUrlText" class="result-box"></div>

        <div class="action-btn-group">
          <a id="btnWhatsApp" href="#" target="_blank" class="btn-whatsapp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
            📲 WhatsApp'ta Müşteriyle Paylaş
          </a>
          <button type="button" id="btnCopy" class="btn-copy">
            📋 Linki Kopyala
          </button>
          <a id="btnTestLink" href="#" target="_blank" class="btn-test">
            👁️ Müşteri Ekranını Önizle
          </a>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast">Link panoya kopyalandı!</div>

  <script src="js/vip-payment.js"></script>
  <script>
    const form = document.getElementById('linkForm');
    const titleInput = document.getElementById('productTitle');
    const amountInput = document.getElementById('productAmount');
    const resultSection = document.getElementById('resultSection');
    const generatedUrlText = document.getElementById('generatedUrlText');
    const btnWhatsApp = document.getElementById('btnWhatsApp');
    const btnCopy = document.getElementById('btnCopy');
    const btnTestLink = document.getElementById('btnTestLink');
    const toast = document.getElementById('toast');
    let currentUrl = '';

    function handleGenerate() {
      const title = titleInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!title) {
        alert('Lütfen ürün veya model adını giriniz.');
        titleInput.focus();
        return;
      }

      if (!amount || amount < 10) {
        alert('Lütfen geçerli bir satış tutarı giriniz.');
        amountInput.focus();
        return;
      }

      const payload = {
        orderId: 'VIP-' + Math.floor(100000 + Math.random() * 900000),
        title,
        amount,
        createdAt: new Date().toISOString()
      };

      const token = VipEngine.encodePayload(payload);
      const baseUrl = window.location.origin + '/vip-odeme.html';
      currentUrl = `${baseUrl}?token=${token}`;

      generatedUrlText.textContent = currentUrl;
      btnWhatsApp.href = VipEngine.buildWhatsAppShareUrl(payload, currentUrl);
      btnTestLink.href = currentUrl;

      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      handleGenerate();
    });

    btnCopy.addEventListener('click', () => {
      if (!currentUrl) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentUrl).then(() => {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
        }).catch(() => fallbackCopy(currentUrl));
      } else {
        fallbackCopy(currentUrl);
      }
    });

    function fallbackCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      } catch (e) {
        prompt('Linki kopyalayınız:', text);
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
