<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260831-lion-max-gold-v5">
  <link rel="alternate icon" href="/favicon.ico?v=20260831-lion-max-gold-v5">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260831-lion-max-gold-v5">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=20260831-lion-max-gold-v5">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20260831-lion-max-gold-v5">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=20260831-lion-max-gold-v5">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belgin Kuyumculuk & Saat</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#032019">
  <meta name="apple-mobile-web-app-title" content="Belgin Ödeme">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #032019;
      --bg-radial: radial-gradient(120% 90% at 50% -10%, #0B4436 0%, #04241D 60%, #01140F 100%);
      --card-bg: #073126;
      --card-border: #135242;
      --card-border-soft: rgba(212, 175, 55, 0.28);
      --gold: #D4AF37;
      --gold-light: #F6E7BC;
      --gold-dim: #AA8222;
      --rolex-green: #006039;
      --text: #F4F7F5;
      --text-muted: #96BEB4;
      --input-bg: #031D16;
      --input-border: #144B3D;
      --success: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: var(--bg-radial);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(15px, 4.2vw, 20px);
      letter-spacing: clamp(1px, 0.5vw, 2.5px);
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      margin: 0 auto;
    }
    
    .container {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .order-card {
      background: linear-gradient(180deg, #083327 0%, #031E17 100%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: 0 24px 60px -10px rgba(0,0,0,0.75), 0 0 35px rgba(212,175,55,0.08), inset 0 1px 0 rgba(255,255,255,0.06);
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    
    .product-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .product-name {
      font-size: 19px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
    }
    .order-id-tag {
      display: inline-block;
      background: var(--input-bg);
      color: var(--gold);
      border: 1px solid var(--input-border);
      font-family: monospace;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .product-price {
      font-size: 28px;
      font-weight: 850;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(212,175,55,0.25);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 13px 15px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 14.5px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.22);
    }
    .form-input::placeholder {
      color: #44776C;
    }
    
    /* ULTRA BELİRGİN LÜKS ŞAMPANYA ALTIN ÖDEME BUTONU */
    .btn-pay-giant {
      width: 100%;
      background: linear-gradient(135deg, #F8E7B9 0%, #D4AF37 45%, #AA8012 100%);
      color: #021B14 !important;
      border: 1px solid #FFF0C8;
      padding: 19px 24px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      box-shadow: 0 12px 34px rgba(212,175,55,0.42), 0 2px 4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.9);
      transition: all 0.15s ease-in-out;
      margin-top: 18px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-pay-giant:hover {
      background: linear-gradient(135deg, #FFF3D1 0%, #E6C252 45%, #C29624 100%);
      transform: translateY(-2px);
      box-shadow: 0 16px 42px rgba(212,175,55,0.55), inset 0 1px 0 #FFF;
    }
    .btn-pay-giant:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(212,175,55,0.35);
    }
    
    .security-badge-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 16px;
    }
    
    /* PAYTR CONTAINER */
    #paytr-container {
      display: none;
      margin-top: 20px;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
  </style>
  <script src="/js/growth.js" defer></script>
</head>
<body>

  <div class="header" style="margin-bottom: 20px; text-align: center;">
    <div style="display:inline-block; position:relative;">
      <img src="images/belgin-vip-lion.png" alt="Belgin Kuyumculuk VIP" style="width:88px; height:88px; object-fit:contain; border-radius:50%; border:2px solid rgba(212,175,55,0.55); box-shadow:0 12px 32px rgba(0,0,0,0.65), 0 0 25px rgba(212,175,55,0.3); filter: drop-shadow(0 4px 14px rgba(212,175,55,0.3));">
    </div>
    <div class="brand-title" style="margin-top:12px;">Belgin Kuyumculuk & Saat</div>
    <div style="font-size:11px; letter-spacing:1.6px; color:var(--gold-light); text-transform:uppercase; font-weight:700; opacity:0.85; margin-top:3px;">VIP Güvenli Tahsilat Portalı</div>
  </div>

  <main class="container">
    
    <div class="order-card">
      
      <!-- 1. VIP TAHSİLAT VE TUTAR KARTI (ÜRÜN ADI ÖN YÜZDE GİZLİ) -->
      <div class="product-summary" style="margin-bottom:18px;">
        <div>
          <div style="font-size:11.5px; font-weight:700; color:var(--gold-light); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">VIP SİPARİŞ TAHSİLATI</div>
          <div id="productTitleDisplay" class="product-name" style="font-size:18px; font-weight:800; color:#FFFFFF;">Showroom Sipariş Bedeli</div>
        </div>
        <div id="productAmountDisplay" class="product-price">₺0</div>
      </div>

      <hr style="border:0; border-top:1px solid var(--card-border); margin:18px 0;">

      <!-- 2. ALICI & FATURA BİLGİLERİ -->
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Adınız Soyadınız *</label>
          <input type="text" id="custName" class="form-input" required placeholder="Adınız Soyadınız">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Telefon Numaranız *</label>
          <input type="tel" id="custPhone" class="form-input" required placeholder="05XX XXX XX XX">
        </div>
      </div>
      <div class="form-group" style="margin-top:14px; margin-bottom:14px;">
        <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
          <span>T.C. Kimlik / Pasaport / Vergi No *</span>
          <span style="font-size:10.5px; color:#D4AF37; text-transform:none; font-weight:600;">⚖️ Fatura & MASAK Zorunlu</span>
        </label>
        <input type="text" id="custIdentity" class="form-input" required placeholder="11 Haneli T.C. Kimlik / Pasaport / Vergi No" maxlength="20" autocomplete="off">
      </div>
      <div class="form-group" style="margin-bottom:18px;">
        <label class="form-label">Teslimat / Fatura Adresi *</label>
        <textarea id="custAddress" class="form-input" rows="2" required placeholder="İl, İlçe, Mahalle, Cadde, Sokak, No, Daire" style="resize:vertical; min-height:64px; font-family:inherit;"></textarea>
      </div>

      <!-- 3. KUVEYT TÜRK KART BİLGİLERİ ALANI -->
      <div id="cardFieldsWrap" style="background:#031D16; border:1.5px solid #144B3D; border-radius:12px; padding:16px; margin-bottom:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #0F3B30; padding-bottom:8px;">
          <span style="font-size:12px; font-weight:800; color:var(--gold-light); text-transform:uppercase; letter-spacing:0.5px;">💳 Kart Bilgileri</span>
          <div style="display:flex; gap:4px;">
            <span style="background:#008450; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">KUVEYT TÜRK</span>
            <span style="background:#1A1F71; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">VISA</span>
            <span style="background:#EB001B; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">Mastercard</span>
            <span style="background:#005BAC; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">TROY</span>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:10px;">
          <label class="form-label">Kart Üzerindeki İsim *</label>
          <input type="text" id="cardHolder" class="form-input" placeholder="Kart üzerindeki Ad Soyad" autocomplete="cc-name">
        </div>

        <div class="form-group" style="margin-bottom:10px;">
          <label class="form-label">Kart Numarası *</label>
          <input type="tel" id="cardNumber" class="form-input" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number">
        </div>

        <div class="form-row">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Son Kullanma (Ay/Yıl) *</label>
            <input type="tel" id="cardExpiry" class="form-input" placeholder="AA/YY" maxlength="5" autocomplete="cc-exp">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Güvenlik Kodu (CVV) *</label>
            <input type="tel" id="cardCvc" class="form-input" placeholder="CVV" maxlength="4" autocomplete="cc-csc">
          </div>
        </div>
      </div>

      <!-- ULTRA BELİRGİN LÜKS ALTIN ÖDEME BUTONU -->
      <button type="button" id="btnCompletePayment" class="btn-pay-giant" onclick="processVipPayment()">
        <span>🔒</span> <span id="btnPayText">ÖDEMEYİ TAMAMLA</span>
      </button>

      <!-- ARKA PLANDA ÇALIŞAN GİZLİ YASAL ONAY VE DELİL MOTORU (HUKUKEN ZORUNLU) -->
      <div style="display:none;" aria-hidden="true">
        <span id="orderIdDisplay">BLG-VIP</span>
        <input type="checkbox" id="chkTerms" required checked>
        <input type="checkbox" id="chkKyc" required checked>
        <input type="checkbox" id="chkHighValue" required checked>
        <input type="checkbox" id="chkHandover" required checked>
        <input type="checkbox" id="chkDeliveryStatement" required checked>
        <input type="checkbox" id="chkMarketing" checked>
        <input type="checkbox" id="chkConsent" checked>
      </div>

    </div>

  </main>

  <script src="/js/vip-payment.js?v=2.9.0"></script>
  <script>
    let currentPayload = null;

    function initPage() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const param = urlParams.get('p') || urlParams.get('token') || urlParams.get('amount') || urlParams.get('tutar');
        
        if (typeof VipEngine !== 'undefined') {
          currentPayload = VipEngine.resolvePayload(param, window.location.pathname, window.location.search);
        }

        if (!currentPayload || !currentPayload.amount) {
          const fallbackAmt = Number(urlParams.get('amount') || urlParams.get('tutar') || 100);
          const fallbackOrderId = (typeof VipEngine !== 'undefined' && VipEngine.generateSecureOrderId)
            ? VipEngine.generateSecureOrderId('VIP-')
            : ((typeof window !== 'undefined' && window.crypto && window.crypto.getRandomValues) ? ('VIP-' + (100000 + (window.crypto.getRandomValues(new Uint32Array(1))[0] % 900000))) : ('VIP-' + (Date.now() % 900000 + 100000)));
          currentPayload = {
            orderId: fallbackOrderId,
            title: urlParams.get('title') || urlParams.get('baslik') || 'Lüks Showroom Siparişi',
            amount: fallbackAmt,
            orderNote: 'Showroom Özel Siparişi'
          };
        }

        if (!currentPayload.rawToken && typeof VipEngine !== 'undefined') {
          currentPayload.rawToken = VipEngine.encodeCompact(currentPayload);
        }

        const orderIdEl = document.getElementById('orderIdDisplay');
        const titleEl = document.getElementById('productTitleDisplay');
        const amountEl = document.getElementById('productAmountDisplay');
        const btn = document.getElementById('btnCompletePayment');
        const btnTextEl = document.getElementById('btnPayText');

        if (orderIdEl) orderIdEl.textContent = currentPayload.orderId || 'BLG-VIP';
        
        // Müşteriye görünen ön yüzde ürün adı GİZLENİR, sadece lüks nötr başlık gösterilir
        if (titleEl) {
          titleEl.textContent = 'Showroom Sipariş Bedeli';
        }

        const provider = (currentPayload?.provider || 'KUVEYTTURK').toUpperCase();
        const isZiraat = provider.includes('ZIRAAT');
        const isTosla = provider.includes('TOSLA');
        const cardWrap = document.getElementById('cardFieldsWrap');
        if (isZiraat && cardWrap) {
          cardWrap.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #0F3B30; padding-bottom:8px;">
              <span style="font-size:12px; font-weight:800; color:var(--gold-light); text-transform:uppercase; letter-spacing:0.5px;">🏦 Banka Ortak Ödeme Kapısı</span>
              <span style="background:#C4122F; color:#FFF; font-size:10px; font-weight:900; padding:2px 7px; border-radius:4px;">ZİRAAT KATILIM</span>
            </div>
            <div style="font-size:12px; color:var(--text-muted); line-height:1.5;">
              Kart bilgileriniz doğrudan <strong>Ziraat Katılım Bankası 3DHost Ortak Ödeme Sayfası</strong> üzerinden 256-Bit SSL şifrelemeyle güvenle alınacaktır.
            </div>
          `;
        } else if (isTosla && cardWrap) {
          const emblemWrap = cardWrap.querySelector('div[style*="display:flex; gap:4px;"]');
          if (emblemWrap) {
            emblemWrap.innerHTML = `
              <span style="background:#E11D48; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">TOSLA İŞİM</span>
              <span style="background:#1A1F71; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">VISA</span>
              <span style="background:#EB001B; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">Mastercard</span>
              <span style="background:#005BAC; color:#FFF; font-size:9px; font-weight:900; padding:2px 5px; border-radius:3px;">TROY</span>
            `;
          }
        }

        const amtFormatted = '₺' + Number(currentPayload.amount || 0).toLocaleString('tr-TR');
        if (amountEl) amountEl.textContent = amtFormatted;
        if (btn) {
          btn.disabled = false;
        }
        if (btnTextEl) {
          btnTextEl.textContent = isZiraat 
            ? `${amtFormatted} ZİRAAT KATILIM İLE ÖDE ➔` 
            : (isTosla ? `${amtFormatted} TOSLA İŞİM İLE ÖDE ➔` : `${amtFormatted} GÜVENLİ ÖDE ➔`);
        }
        
        syncDraft();

        // --- İPTAL EDİLMİŞ VIP LİNK KONTROLÜ ---
        if (currentPayload && currentPayload.orderId) {
          fetch('/api/payment/check-vip?orderId=' + encodeURIComponent(currentPayload.orderId))
            .then(res => res.json())
            .then(data => {
              if (data && data.cancelled === true) {
                renderCancelledState();
              }
            })
            .catch(() => {});
        }
      } catch (err) {
        console.error('initPage Error:', err);
      }
    }

    function renderCancelledState() {
      const cardWrap = document.querySelector('.order-card');
      if (cardWrap) {
        cardWrap.innerHTML = `
          <div style="background:rgba(239,68,68,0.12); border:1.5px solid #ef4444; border-radius:16px; padding:32px 20px; text-align:center; margin:10px 0;">
            <div style="font-size:46px; margin-bottom:12px; line-height:1;">🚫</div>
            <div style="font-size:17.5px; font-weight:800; color:#ef4444; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px;">BU VIP ÖDEME LİNKİ İPTAL EDİLMİŞTİR</div>
            <div style="font-size:13px; color:#F3F6F5; line-height:1.6; margin-bottom:18px; max-width:380px; margin-left:auto; margin-right:auto;">
              Bu özel ödeme bağlantısı güvenlik ve operasyon gerekçesiyle yönetici tarafından iptal edilmiştir. Bu link üzerinden tahsilat kabul edilmemektedir.
            </div>
            <div style="font-size:11.5px; color:var(--text-muted); border-top:1px solid rgba(239,68,68,0.25); padding-top:14px; margin-bottom:18px;">
              Yeni bir ödeme bağlantısı için lütfen <strong>Belgin Kuyumculuk VIP Satış Ekibi</strong> ile iletişime geçiniz.
            </div>
            <div>
              <a href="https://wa.me/905322123456" target="_blank" style="display:inline-flex; align-items:center; gap:8px; background:#25D366; color:#FFF; font-weight:700; font-size:13px; padding:11px 20px; border-radius:30px; text-decoration:none; box-shadow:0 4px 14px rgba(37,211,102,0.3);">
                <span>💬</span> Müşteri Temsilcisine Bağlan
              </a>
            </div>
          </div>
        `;
      }
    }

    function syncDraft() {
      const name = document.getElementById('custName')?.value?.trim() || '';
      const phone = document.getElementById('custPhone')?.value?.trim() || '';
      const identity = document.getElementById('custIdentity')?.value?.trim() || '';
      const address = document.getElementById('custAddress')?.value?.trim() || '';
      const amt = Number(currentPayload?.amount || 0);
      const isPaytr = currentPayload?.provider === 'PAYTR';
      const isZiraat = (currentPayload?.provider || '').toUpperCase().includes('ZIRAAT');
      const isTosla = (currentPayload?.provider || '').toUpperCase().includes('TOSLA');

      let paymentMethodName = 'Kuveyt Türk Sanal POS 256-Bit SSL 3D Secure / Kredi Kartı';
      if (isZiraat) {
        paymentMethodName = 'Ziraat Katılım Sanal POS 256-Bit SSL 3DHost / Kredi Kartı';
      } else if (isTosla) {
        paymentMethodName = 'Tosla İşim Sanal POS (Akbank) 256-Bit SSL 3D Secure';
      } else if (isPaytr) {
        paymentMethodName = 'PayTR 256-Bit SSL 3D Secure / Kredi Kartı';
      }

      const draft = {
        orderId: currentPayload?.orderId,
        customerName: name || 'Müşteri (Sipariş Sahibi)',
        customerPhone: phone || '05XX *** ** XX',
        customerIdentity: identity || '',
        customerAddress: address || '',
        totalAmount: amt > 0 ? amt : 100,
        formattedAmount: '₺' + (amt > 0 ? amt : 100).toLocaleString('tr-TR'),
        termsAcceptedAt: new Date().toISOString(),
        paymentMethod: paymentMethodName
      };
      sessionStorage.setItem('belgin_checkout_draft', JSON.stringify(draft));
      localStorage.setItem('belgin_checkout_draft', JSON.stringify(draft));
    }

    document.getElementById('custName')?.addEventListener('input', syncDraft);
    document.getElementById('custPhone')?.addEventListener('input', syncDraft);
    // --- KART BİLGİLERİ FORMATLAYICILARI ---
    const cardNumInput = document.getElementById('cardNumber');
    const cardExpInput = document.getElementById('cardExpiry');
    const cardCvcInput = document.getElementById('cardCvc');
    const cardHolderInput = document.getElementById('cardHolder');

    if (cardNumInput) {
      cardNumInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 16);
        let formatted = v.match(/.{1,4}/g)?.join(' ') || v;
        e.target.value = formatted;
      });
    }

    if (cardExpInput) {
      cardExpInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 4);
        if (v.length >= 2) {
          e.target.value = v.slice(0, 2) + '/' + v.slice(2);
        } else {
          e.target.value = v;
        }
      });
    }

    if (cardCvcInput) {
      cardCvcInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      });
    }

    document.getElementById('custName')?.addEventListener('input', (e) => {
      syncDraft();
      if (cardHolderInput && !cardHolderInput.dataset.manual) {
        cardHolderInput.value = e.target.value.toLocaleUpperCase('tr-TR');
      }
    });

    if (cardHolderInput) {
      cardHolderInput.addEventListener('input', () => {
        cardHolderInput.dataset.manual = 'true';
      });
    }

    document.getElementById('custPhone')?.addEventListener('input', syncDraft);
    document.getElementById('custIdentity')?.addEventListener('input', syncDraft);
    document.getElementById('custAddress')?.addEventListener('input', syncDraft);

    async function processVipPayment() {
      const name = document.getElementById('custName')?.value?.trim() || '';
      const phone = document.getElementById('custPhone')?.value?.trim() || '';
      const identity = document.getElementById('custIdentity')?.value?.trim() || '';
      const address = document.getElementById('custAddress')?.value?.trim() || '';

      if (!name || !phone) {
        alert('Lütfen adınızı, soyadınızı ve telefon numaranızı eksiksiz doldurunuz.');
        document.getElementById('custName')?.focus();
        return;
      }

      if (!identity) {
        alert('Lütfen fatura ve güvenlik doğrulaması için T.C. Kimlik / Pasaport / Vergi numaranızı giriniz.');
        document.getElementById('custIdentity')?.focus();
        return;
      }

      if (!address || address.length < 5) {
        alert('Lütfen fatura ve yasal teslimat için açık adresinizi (İl, İlçe, Mahalle, Cadde, No) giriniz.');
        document.getElementById('custAddress')?.focus();
        return;
      }

      syncDraft();

      // İptal kontrolü (Ödeme öncesi son kapı)
      if (currentPayload && currentPayload.orderId) {
        try {
          const chk = await fetch('/api/payment/check-vip?orderId=' + encodeURIComponent(currentPayload.orderId)).then(r => r.json());
          if (chk && chk.cancelled === true) {
            alert('Bu VIP ödeme bağlantısı iptal edilmiştir. Tahsilat gerçekleştirilemez.');
            renderCancelledState();
            return;
          }
        } catch (_) {}
      }

      const provider = (currentPayload?.provider || 'KUVEYTTURK').toUpperCase();
      const isZiraat = provider.includes('ZIRAAT');

      let cardHolder = '';
      let rawCardNum = '';
      let rawCardExp = '';
      let rawCardCvc = '';

      if (!isZiraat) {
        // Kuveyt Türk için kart bilgileri zorunludur
        cardHolder = (cardHolderInput?.value || name).trim().toLocaleUpperCase('tr-TR');
        rawCardNum = (cardNumInput?.value || '').replace(/\D/g, '');
        rawCardExp = (cardExpInput?.value || '').trim();
        rawCardCvc = (cardCvcInput?.value || '').replace(/\D/g, '');

        if (!rawCardNum || rawCardNum.length < 15) {
          alert('Lütfen geçerli 16 haneli kart numaranızı giriniz.');
          cardNumInput?.focus();
          return;
        }

        if (!rawCardExp.includes('/') || rawCardExp.length < 4) {
          alert('Lütfen kartınızın son kullanma tarihini AA/YY formatında giriniz (Örn: 08/28).');
          cardExpInput?.focus();
          return;
        }

        if (!rawCardCvc || rawCardCvc.length < 3) {
          alert('Lütfen kartınızın arka yüzündeki 3 haneli güvenlik kodunu (CVV) giriniz.');
          cardCvcInput?.focus();
          return;
        }
      }

      const btn = document.getElementById('btnCompletePayment');
      const originalHtml = btn ? btn.innerHTML : '';
      const isTosla = provider.includes('TOSLA');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = isZiraat
          ? '<span>🔒</span> Ziraat Katılım 3DHost Sayfasına Yönlendiriliyorsunuz...'
          : (isTosla ? '<span>🔒</span> Tosla İşim 3D Secure SMS Doğrulamasına Geçiliyor...' : '<span>🔒</span> Kuveyt Türk 3D Secure SMS Doğrulamasına Geçiliyor...');
      }

      try {
        const cleanPhone = phone.replace(/\D/g, '');
        const token = currentPayload.rawToken || (typeof VipEngine !== 'undefined' ? VipEngine.encodeCompact(currentPayload) : null);
        const is22 = Boolean(currentPayload.isVip22 || (typeof VipEngine !== 'undefined' && VipEngine.isVip22Tag && VipEngine.isVip22Tag(currentPayload.title)));
        const totalAmt = Number(currentPayload.amount || 100);

        let orderItems = [
          {
            id: currentPayload.orderId || `VIP-${Date.now()}`,
            name: currentPayload.title || 'Lüks Showroom Siparişi',
            price: totalAmt,
            qty: 1,
            isVipCustom: true,
            vipToken: token,
            brand: 'Belgin Kuyumculuk',
            category: 'luxury'
          }
        ];

        const orderPayload = {
          provider: provider,
          isVipPayment: true,
          isVip22: is22,
          vipToken: token,
          title: currentPayload.title || 'Lüks Showroom Siparişi',
          productName: currentPayload.title || 'Lüks Showroom Siparişi',
          vipTitle: currentPayload.title || null,
          user_name: name,
          user_phone: phone,
          email: cleanPhone ? `musteri_${cleanPhone}@belginkuyumculuk.com` : `vip_${Date.now()}@belginkuyumculuk.com`,
          customerIdentity: identity,
          customerAddress: address,
          user_address: address,
          address: address,
          cardHolder: cardHolder,
          cardNumber: rawCardNum,
          cardExpiry: rawCardExp,
          cardCvc: rawCardCvc,
          deliveryMethod: 'showroom',
          termsAccepted: true,
          preInformationAccepted: true,
          highValueDeliveryAccepted: true,
          deliveryStatementAccepted: true,
          marketingConsent: true,
          items: orderItems
        };

        const response = await fetch('/api/payment/create?_t=' + Date.now(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify(orderPayload)
        });

        let data = {};
        try { data = await response.json(); } catch (_) { data = {}; }

        if (!response.ok || !data.success) {
          throw new Error(data.message || `${provider} Sanal POS bağlantısı kurulamadı.`);
        }

        // 1. KUVEYT TÜRK 3D SECURE SMS AKIŞI (Banka SMS Şifresi Ekranı)
        if (data.formHtml || data.paymentType === 'HTML_FORM') {
          const rawHtml = data.formHtml || '';
          document.open();
          document.write(rawHtml);
          document.close();

          setTimeout(() => {
            try {
              if (document.threeDSServerWebFlowStartForm && typeof document.threeDSServerWebFlowStartForm.submit === 'function') {
                document.threeDSServerWebFlowStartForm.submit();
              } else if (document.downloadForm && typeof document.downloadForm.submit === 'function') {
                document.downloadForm.submit();
              } else if (document.getElementById('threeDSServerWebFlowStartForm')) {
                document.getElementById('threeDSServerWebFlowStartForm').submit();
              } else if (document.forms && document.forms.length > 0) {
                document.forms[0].submit();
              }
            } catch (_) {}
          }, 50);
          return;
        }

        if (data.formData && data.gatewayUrl) {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = data.gatewayUrl;
          const enc = data.enctype || 'multipart/form-data';
          form.enctype = enc;
          form.encoding = enc;
          form.acceptCharset = 'UTF-8';
          form.style.display = 'none';
          for (const [k, v] of Object.entries(data.formData)) {
            if (v !== undefined && v !== null) {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = k;
              input.value = String(v);
              form.appendChild(input);
            }
          }
          document.body.appendChild(form);
          HTMLFormElement.prototype.submit.call(form);
          return;
        }

        if (data.iframeUrl) {
          window.location.href = data.iframeUrl;
          return;
        }

        if (data.token && provider === 'PAYTR') {
          window.location.href = `https://www.paytr.com/odeme/guvenli/${data.token}`;
          return;
        }

        if (data.gatewayUrl && data.postParams) {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = data.gatewayUrl;
          form.enctype = 'application/x-www-form-urlencoded';
          form.acceptCharset = 'UTF-8';
          form.style.display = 'none';
          for (const [k, v] of Object.entries(data.postParams)) {
            if (v !== undefined && v !== null) {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = k;
              input.value = String(v);
              form.appendChild(input);
            }
          }
          document.body.appendChild(form);
          HTMLFormElement.prototype.submit.call(form);
        } else if (data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else {
          window.location.href = `/odeme-basarili.html?orderId=${encodeURIComponent(data.merchant_oid || '')}`;
        }

      } catch (err) {
        console.error('VIP Ödeme Hatası:', err);
        alert('Ödeme başlatılamadı: ' + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
