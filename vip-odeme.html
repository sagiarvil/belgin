<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belgin Kuyumculuk & Saat</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1412">
  <meta name="apple-mobile-web-app-title" content="Belgin Ödeme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="images/link-icon-180.png">
  <link rel="apple-touch-icon-precomposed" href="images/link-icon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A1412;
      --card-bg: #122220;
      --card-border: #1E3835;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --teal-accent: #178370;
      --text: #F0F4F3;
      --text-muted: #8EAAA5;
      --input-bg: #0B1917;
      --input-border: #23433F;
      --success: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(15px, 4.2vw, 20px);
      letter-spacing: clamp(1px, 0.5vw, 2.5px);
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      margin: 0 auto;
    }
    
    .container {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    
    .product-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .product-name {
      font-size: 19px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
    }
    .order-id-tag {
      display: inline-block;
      background: var(--input-bg);
      color: var(--gold);
      border: 1px solid var(--input-border);
      font-family: monospace;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .product-price {
      font-size: 28px;
      font-weight: 850;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(212,175,55,0.25);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 13px 15px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14.5px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
    }
    .form-input::placeholder {
      color: #4A6B65;
    }
    
    /* BÜYÜK LÜKS ALTIN ÖDEME BUTONU */
    .btn-pay-giant {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #0A1412;
      border: none;
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 30px rgba(212,175,55,0.3);
      transition: transform 0.1s, box-shadow 0.2s;
      margin-top: 10px;
    }
    .btn-pay-giant:hover {
      box-shadow: 0 10px 36px rgba(212,175,55,0.45);
    }
    .btn-pay-giant:active {
      transform: scale(0.98);
    }
    
    .security-badge-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 16px;
    }
    
    /* PAYTR CONTAINER */
    #paytr-container {
      display: none;
      margin-top: 20px;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="images/belgin-crest-b.png" alt="Belgin Emblemi" style="width:84px; height:84px; object-fit:contain; margin-bottom:12px; filter: drop-shadow(0 4px 16px rgba(212,175,55,0.4));">
    <div class="brand-title">Belgin Kuyumculuk & Saat</div>
  </div>

  <main class="container">
    
    <div class="order-card">
      
      <!-- 1. ÜRÜN VE TUTAR KARTI -->
      <div class="section-title">
        <span>✨ Sipariş Detayı</span>
        <span id="orderIdDisplay" class="order-id-tag">BLG-SİPARİŞ</span>
      </div>
      
      <div class="product-summary">
        <div>
          <div id="productTitleDisplay" class="product-name">Lüks Koleksiyon Ürünü</div>
        </div>
        <div id="productAmountDisplay" class="product-price">₺0</div>
      </div>

      <hr style="border:0; border-top:1px solid var(--card-border); margin:20px 0;">

      <!-- 2. ALICI BİLGİLERİ -->
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Adınız Soyadınız *</label>
          <input type="text" id="custName" class="form-input" required placeholder="Adınız Soyadınız">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Telefon Numaranız *</label>
          <input type="tel" id="custPhone" class="form-input" required placeholder="05XX XXX XX XX">
        </div>
      </div>
      <div class="form-group" style="margin-top:14px; margin-bottom:18px;">
        <label class="form-label">T.C. Kimlik / Pasaport No *</label>
        <input type="text" id="custIdentity" class="form-input" required placeholder="T.C. Kimlik veya Pasaport Numarası" maxlength="20">
      </div>

      <!-- 3. DOĞRUDAN AKBANK SANAL POS KART GİRİŞ FORMU -->
      <div style="background:var(--input-bg); border:1.5px solid var(--input-border); border-radius:12px; padding:18px; margin-bottom:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--card-border); padding-bottom:10px;">
          <span style="font-size:13px; font-weight:700; color:var(--gold-light); display:flex; align-items:center; gap:6px;">
            <span>💳</span> Kart Bilgileri
          </span>
          <span id="vipCardTypeBadge" style="font-size:11px; font-weight:800; background:rgba(212,175,55,0.15); color:var(--gold); border:1px solid rgba(212,175,55,0.3); padding:3px 8px; border-radius:4px;">KART</span>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">Kart Üzerindeki İsim Soyisim *</label>
          <input type="text" id="vipCcHolder" class="form-input" required placeholder="AD SOYAD" autocomplete="cc-name" oninput="this.value = this.value.toLocaleUpperCase('tr-TR')">
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">Kart Numarası *</label>
          <input type="tel" id="vipCcNumber" class="form-input" required placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number" oninput="formatVipCardNumber(this)" style="font-family:monospace; letter-spacing:1px; font-size:15px;">
        </div>

        <div class="form-row" style="margin-bottom:0;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Son Kullanma *</label>
            <input type="tel" id="vipCcExpiry" class="form-input" required placeholder="AA / YY" maxlength="7" autocomplete="cc-exp" oninput="formatVipCardExpiry(this)">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">CVC / Güvenlik Kodu *</label>
            <input type="tel" id="vipCcCvc" class="form-input" required placeholder="CVC" maxlength="4" autocomplete="cc-csc" oninput="formatVipCardCvv(this)">
          </div>
        </div>
      </div>

      <!-- BÜYÜK ALTIN ÖDEME BUTONU -->
      <button type="button" id="btnCompletePayment" class="btn-pay-giant" onclick="processVipPayment()">
        <span>🔒</span> Akbank 3D Secure ile Güvenli Öde
      </button>

      <!-- ÖDEME SAĞLAYICI LOGO BANTI (AKBANK SANAL POS & KART AĞLARI) -->
      <div style="background:#FFFFFF; border-radius:10px; padding:10px 14px; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:12px;">
        <img src="images/iyzico-odeme-yontemleri.png" alt="Mastercard, Visa, Troy, 3D Secure" style="max-height:24px; width:auto; max-width:100%; object-fit:contain;" loading="lazy">
      </div>

      <div class="security-badge-footer">
        <span>🛡️</span> Akbank Sanal POS (No: 12865794) · 256-Bit EV SSL · 3D Secure 2.0 · Tek Çekim
      </div>

      <!-- AKBANK 3D SECURE MODAL / IFRAME -->
      <div id="paytr-container">
        <div style="text-align:center; font-weight:700; color:#0A1412; margin-bottom:12px; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px;">
          <span>🔒</span> Akbank 256-Bit SSL & 3D Secure Kart Ödeme Ekranı
        </div>
        <div id="paytr-iframe-wrapper"></div>
      </div>

      <!-- ARKA PLANDA ÇALIŞAN GİZLİ YASAL ONAY VE DELİL MOTORU -->
      <div style="display:none;" aria-hidden="true">
        <input type="checkbox" id="chkTerms" required checked>
        <input type="checkbox" id="chkKyc" required checked>
        <input type="checkbox" id="chkHighValue" required checked>
        <input type="checkbox" id="chkHandover" required checked>
        <input type="checkbox" id="chkMarketing" checked>
        <input type="checkbox" id="chkConsent" checked>
      </div>

    </div>

  </main>

  <script src="/js/vip-payment.js?v=2.8.1"></script>
  <script>
    let currentPayload = null;

    function formatVipCardNumber(input) {
      if (!input) return;
      let v = input.value.replace(/\D/g, '').slice(0, 16);
      let formatted = v.replace(/(\d{4})(?=\d)/g, '$1 ');
      input.value = formatted;

      const badge = document.getElementById('vipCardTypeBadge');
      if (!badge) return;
      if (v.startsWith('4')) {
        badge.textContent = 'VISA';
        badge.style.color = '#1A1F71';
        badge.style.background = '#E8ECF8';
      } else if (v.startsWith('51') || v.startsWith('52') || v.startsWith('53') || v.startsWith('54') || v.startsWith('55') || (v >= '2221' && v <= '2720')) {
        badge.textContent = 'MASTERCARD';
        badge.style.color = '#EB001B';
        badge.style.background = '#FDE8E9';
      } else if (v.startsWith('9792')) {
        badge.textContent = 'TROY';
        badge.style.color = '#0083CA';
        badge.style.background = '#E6F4FB';
      } else {
        badge.textContent = 'KART';
        badge.style.color = 'var(--gold)';
        badge.style.background = 'rgba(212,175,55,0.15)';
      }
    }

    function formatVipCardExpiry(input) {
      if (!input) return;
      let v = input.value.replace(/\D/g, '').slice(0, 4);
      if (v.length > 2) {
        input.value = v.slice(0, 2) + ' / ' + v.slice(2);
      } else {
        input.value = v;
      }
    }

    function formatVipCardCvv(input) {
      if (!input) return;
      input.value = input.value.replace(/\D/g, '').slice(0, 4);
    }

    function initPage() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const param = urlParams.get('p') || urlParams.get('token') || urlParams.get('amount') || urlParams.get('tutar');
        
        if (typeof VipEngine !== 'undefined') {
          currentPayload = VipEngine.resolvePayload(param, window.location.pathname, window.location.search);
        }

        if (!currentPayload || !currentPayload.amount) {
          const fallbackAmt = Number(urlParams.get('amount') || urlParams.get('tutar') || 100);
          currentPayload = {
            orderId: 'VIP-' + Math.floor(100000 + Math.random() * 900000),
            title: urlParams.get('title') || urlParams.get('baslik') || 'Lüks Showroom Siparişi',
            amount: fallbackAmt,
            orderNote: 'Showroom Özel Siparişi'
          };
        }

        if (!currentPayload.rawToken && typeof VipEngine !== 'undefined') {
          currentPayload.rawToken = VipEngine.encodeCompact(currentPayload);
        }

        const orderIdEl = document.getElementById('orderIdDisplay');
        const titleEl = document.getElementById('productTitleDisplay');
        const amountEl = document.getElementById('productAmountDisplay');
        const btn = document.getElementById('btnCompletePayment');

        if (orderIdEl) orderIdEl.textContent = currentPayload.orderId || 'BLG-VIP';
        if (titleEl) titleEl.textContent = currentPayload.title || 'Lüks Koleksiyon Ürünü';
        if (amountEl) amountEl.textContent = '₺' + Number(currentPayload.amount || 0).toLocaleString('tr-TR');
        if (btn) btn.disabled = false;
        
        syncDraft();
      } catch (err) {
        console.error('initPage Error:', err);
      }
    }

    function syncDraft() {
      const name = document.getElementById('custName')?.value?.trim() || '';
      const phone = document.getElementById('custPhone')?.value?.trim() || '';
      const identity = document.getElementById('custIdentity')?.value?.trim() || '';
      const amt = Number(currentPayload?.amount || 0);

      const draft = {
        orderId: currentPayload?.orderId,
        customerName: name || 'Müşteri (Sipariş Sahibi)',
        customerPhone: phone || '05XX *** ** XX',
        customerIdentity: identity || '',
        totalAmount: amt > 0 ? amt : 100,
        formattedAmount: '₺' + (amt > 0 ? amt : 100).toLocaleString('tr-TR'),
        termsAcceptedAt: new Date().toISOString(),
        paymentMethod: 'Akbank Sanal POS 256-Bit SSL 3D Secure / Kredi Kartı'
      };
      sessionStorage.setItem('belgin_checkout_draft', JSON.stringify(draft));
      localStorage.setItem('belgin_checkout_draft', JSON.stringify(draft));
    }

    document.getElementById('custName')?.addEventListener('input', syncDraft);
    document.getElementById('custPhone')?.addEventListener('input', syncDraft);
    document.getElementById('custIdentity')?.addEventListener('input', syncDraft);

    async function processVipPayment() {
      const name = document.getElementById('custName')?.value?.trim() || '';
      const phone = document.getElementById('custPhone')?.value?.trim() || '';
      const identity = document.getElementById('custIdentity')?.value?.trim() || '';
      const cardHolder = document.getElementById('vipCcHolder')?.value?.trim() || '';
      const cardNumber = (document.getElementById('vipCcNumber')?.value || '').replace(/\D/g, '');
      const cardExpiry = document.getElementById('vipCcExpiry')?.value?.trim() || '';
      const cardCvc = document.getElementById('vipCcCvc')?.value?.trim() || '';

      if (!name || !phone) {
        alert('Lütfen adınızı, soyadınızı ve telefon numaranızı eksiksiz doldurunuz.');
        document.getElementById('custName')?.focus();
        return;
      }

      if (!identity) {
        alert('Lütfen fatura ve güvenlik doğrulaması için T.C. Kimlik / Pasaport numaranızı giriniz.');
        document.getElementById('custIdentity')?.focus();
        return;
      }

      if (!cardHolder) {
        alert('Lütfen kart üzerindeki isim soyismi giriniz.');
        document.getElementById('vipCcHolder')?.focus();
        return;
      }

      if (cardNumber.length < 15) {
        alert('Lütfen geçerli bir 16 haneli kart numarası giriniz.');
        document.getElementById('vipCcNumber')?.focus();
        return;
      }

      if (cardExpiry.length < 5) {
        alert('Lütfen kart son kullanma tarihini (AA / YY) giriniz.');
        document.getElementById('vipCcExpiry')?.focus();
        return;
      }

      if (cardCvc.length < 3) {
        alert('Lütfen kart güvenlik kodunu (CVC) giriniz.');
        document.getElementById('vipCcCvc')?.focus();
        return;
      }

      syncDraft();

      const btn = document.getElementById('btnCompletePayment');
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>🔒</span> Akbank 3D Secure Kapısına Bağlanılıyor...';
      }

      try {
        const cleanPhone = phone.replace(/\D/g, '');
        const token = currentPayload.rawToken || (typeof VipEngine !== 'undefined' ? VipEngine.encodeCompact(currentPayload) : null);
        const orderPayload = {
          provider: 'AKBANK',
          isVipPayment: true,
          vipToken: token,
          user_name: name,
          user_phone: phone,
          email: cleanPhone ? `musteri_${cleanPhone}@belginkuyumculuk.com` : `vip_${Date.now()}@belginkuyumculuk.com`,
          customerIdentity: identity,
          cardHolder: cardHolder,
          cardNumber: cardNumber,
          cardExpiry: cardExpiry,
          cardCvc: cardCvc,
          deliveryMethod: 'showroom',
          termsAccepted: true,
          preInformationAccepted: true,
          highValueDeliveryAccepted: true,
          marketingConsent: true,
          items: [
            {
              id: currentPayload.orderId || `VIP-${Date.now()}`,
              name: currentPayload.title || 'Lüks Showroom Siparişi',
              price: Number(currentPayload.amount || 100),
              qty: 1,
              isVipCustom: true,
              vipToken: token,
              brand: 'Belgin Kuyumculuk',
              category: 'luxury'
            }
          ]
        };

        const response = await fetch('/api/payment/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload)
        });

        let data = {};
        try { data = await response.json(); } catch (_) { data = {}; }

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Akbank Sanal POS 3D Secure bağlantısı kurulamadı.');
        }

        if (data.gatewayUrl && data.postParams) {
          // DOĞRUDAN RESMİ AKBANK EST 3D SECURE KAPISINA GÖNDERİM
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = data.gatewayUrl;
          form.enctype = 'application/x-www-form-urlencoded';
          form.acceptCharset = 'UTF-8';
          form.style.display = 'none';
          for (const [k, v] of Object.entries(data.postParams)) {
            if (v !== undefined && v !== null) {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = k;
              input.value = String(v);
              form.appendChild(input);
            }
          }
          document.body.appendChild(form);
          form.submit();
        } else if (data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else {
          window.location.href = `/odeme-basarili.html?orderId=${encodeURIComponent(data.merchant_oid || '')}`;
        }

      } catch (err) {
        console.error('VIP Ödeme Hatası:', err);
        alert('Ödeme başlatılamadı: ' + err.message);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
