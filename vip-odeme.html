<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Güvenli Ödeme | Belgin Kuyumculuk & Saat</title>
  <meta name="description" content="Belgin Kuyumculuk & Saat 3D Secure 256-Bit SSL Güvenli Ödeme ve Sipariş Doğrulama Sayfası.">
  <meta name="theme-color" content="#0A1412">
  <meta name="apple-mobile-web-app-title" content="Belgin Ödeme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="images/link-icon-180.png">
  <link rel="apple-touch-icon-precomposed" href="images/link-icon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A1412;
      --card-bg: #122220;
      --card-border: #1E3835;
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --teal-accent: #178370;
      --text: #F0F4F3;
      --text-muted: #8EAAA5;
      --input-bg: #0B1917;
      --input-border: #23433F;
      --success: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      padding: 20px 0 24px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(15px, 4.2vw, 20px);
      letter-spacing: clamp(1px, 0.5vw, 2.5px);
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      margin: 0 auto;
    }
    
    .container {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    
    .product-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .product-name {
      font-size: 19px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
    }
    .order-id-tag {
      display: inline-block;
      background: var(--input-bg);
      color: var(--gold);
      border: 1px solid var(--input-border);
      font-family: monospace;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .product-price {
      font-size: 28px;
      font-weight: 850;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(212,175,55,0.25);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 13px 15px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14.5px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
    }
    .form-input::placeholder {
      color: #4A6B65;
    }
    
    /* BÜYÜK LÜKS ALTIN ÖDEME BUTONU */
    .btn-pay-giant {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #0A1412;
      border: none;
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 30px rgba(212,175,55,0.3);
      transition: transform 0.1s, box-shadow 0.2s;
      margin-top: 10px;
    }
    .btn-pay-giant:hover {
      box-shadow: 0 10px 36px rgba(212,175,55,0.45);
    }
    .btn-pay-giant:active {
      transform: scale(0.98);
    }
    
    .security-badge-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 16px;
    }
    
    /* PAYTR CONTAINER */
    #paytr-container {
      display: none;
      margin-top: 20px;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="images/belgin-crest-b.png" alt="Belgin Emblemi" style="width:84px; height:84px; object-fit:contain; margin-bottom:12px; filter: drop-shadow(0 4px 16px rgba(212,175,55,0.4));">
    <div class="brand-title">Belgin Kuyumculuk & Saat</div>
  </div>

  <main class="container">
    
    <div class="order-card">
      
      <!-- 1. ÜRÜN VE TUTAR KARTI -->
      <div class="section-title">
        <span>✨ Sipariş Detayı</span>
        <span id="orderIdDisplay" class="order-id-tag">BLG-SİPARİŞ</span>
      </div>
      
      <div class="product-summary">
        <div>
          <div id="productTitleDisplay" class="product-name">Lüks Koleksiyon Ürünü</div>
        </div>
        <div id="productAmountDisplay" class="product-price">₺0</div>
      </div>

      <hr style="border:0; border-top:1px solid var(--card-border); margin:20px 0;">

      <!-- 2. ALICI BİLGİLERİ -->
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Adınız Soyadınız *</label>
          <input type="text" id="custName" class="form-input" required placeholder="Adınız Soyadınız">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Telefon Numaranız *</label>
          <input type="tel" id="custPhone" class="form-input" required placeholder="05XX XXX XX XX">
        </div>
      </div>

      <div class="form-group" style="margin-top:14px; margin-bottom:18px;">
        <label class="form-label">T.C. Kimlik / Pasaport No *</label>
        <input type="text" id="custIdentity" class="form-input" required placeholder="Fatura & Doğrulama İçin T.C. Kimlik No">
      </div>

      <!-- BÜYÜK ALTIN ÖDEME BUTONU -->
      <button type="button" id="btnCompletePayment" class="btn-pay-giant" onclick="processVipPayment()">
        <span>🔒</span> 3D Secure ile Güvenli Öde
      </button>

      <div class="security-badge-footer">
        <span>🛡️</span> 256-Bit SSL Şifreleme · 3D Secure SMS Onayı · PayTR
      </div>

      <!-- PAYTR 3D SECURE IFRAME ALANI -->
      <div id="paytr-container">
        <div style="text-align:center; font-weight:700; color:#0A1412; margin-bottom:12px; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px;">
          <span>🔒</span> PayTR 256-Bit SSL & 3D Secure Kart Ödeme Ekranı
        </div>
        <div id="paytr-iframe-wrapper"></div>
      </div>

      <!-- ARKA PLANDA ÇALIŞAN GİZLİ YASAL ONAY VE DELİL MOTORU (EKRANDA GÖRÜNMEZ, HUKUKEN %100 KAYDEDİLİR) -->
      <div style="display:none;" aria-hidden="true">
        <input type="checkbox" id="chkTerms" required checked>
        <input type="checkbox" id="chkKyc" required checked>
        <input type="checkbox" id="chkHighValue" required checked>
        <input type="checkbox" id="chkHandover" required checked>
        <input type="checkbox" id="chkMarketing" checked>
        <input type="checkbox" id="chkConsent" checked>
      </div>

    </div>

  </main>

  <script src="/js/vip-payment.js?v=2.7.0"></script>
  <script>
    let currentPayload = null;

    function initPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const param = urlParams.get('p') || urlParams.get('token');
      
      if (typeof VipEngine !== 'undefined') {
        currentPayload = VipEngine.resolvePayload(param, window.location.pathname);
      }

      if (!currentPayload) {
        currentPayload = {
          orderId: 'BLG-' + Math.floor(100000 + Math.random() * 900000),
          title: 'Lüks Showroom Siparişi',
          amount: 14960,
          orderNote: 'Showroom Özel Siparişi'
        };
      }

      document.getElementById('orderIdDisplay').textContent = currentPayload.orderId || 'BLG-VIP';
      document.getElementById('productTitleDisplay').textContent = currentPayload.title || 'Lüks Koleksiyon Ürünü';
      document.getElementById('productAmountDisplay').textContent = '₺' + Number(currentPayload.amount || 0).toLocaleString('tr-TR');
      
      syncDraft();
    }

    function syncDraft() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const identity = document.getElementById('custIdentity').value.trim();

      const draft = {
        orderId: currentPayload?.orderId,
        customerName: name || 'Müşteri (Sipariş Sahibi)',
        customerPhone: phone || '05XX *** ** XX',
        customerIdentity: identity || '',
        totalAmount: currentPayload?.amount || 14960,
        formattedAmount: '₺' + Number(currentPayload?.amount || 14960).toLocaleString('tr-TR'),
        termsAcceptedAt: new Date().toISOString(),
        paymentMethod: 'PayTR 256-Bit SSL 3D Secure / Kredi Kartı'
      };
      sessionStorage.setItem('belgin_checkout_draft', JSON.stringify(draft));
      localStorage.setItem('belgin_checkout_draft', JSON.stringify(draft));
    }

    document.getElementById('custName').addEventListener('input', syncDraft);
    document.getElementById('custPhone').addEventListener('input', syncDraft);
    document.getElementById('custIdentity').addEventListener('input', syncDraft);

    async function processVipPayment() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const identity = document.getElementById('custIdentity').value.trim();

      if (!name || !phone) {
        alert('Lütfen adınızı, soyadınızı ve telefon numaranızı eksiksiz doldurunuz.');
        return;
      }

      if (!identity) {
        alert('Lütfen fatura ve güvenlik doğrulaması için T.C. Kimlik / Pasaport numaranızı giriniz.');
        return;
      }

      syncDraft();

      const btn = document.getElementById('btnCompletePayment');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> 3D Secure Bağlantısı Kuruluyor...';

      try {
        const cleanPhone = phone.replace(/\D/g, '');
        const orderPayload = {
          isVipPayment: true,
          user_name: name,
          user_phone: phone,
          email: cleanPhone ? `musteri_${cleanPhone}@belginkuyumculuk.com` : `vip_${Date.now()}@belginkuyumculuk.com`,
          customerIdentity: identity,
          deliveryMethod: 'showroom',
          termsAccepted: true,
          preInformationAccepted: true,
          highValueDeliveryAccepted: true,
          marketingConsent: true,
          items: [
            {
              id: currentPayload.orderId || `VIP-${Date.now()}`,
              name: currentPayload.title || 'Lüks Showroom Siparişi',
              price: Number(currentPayload.amount),
              qty: 1,
              isVipCustom: true,
              brand: 'Belgin Kuyumculuk',
              category: 'luxury'
            }
          ]
        };

        const response = await fetch('/api/createPayTRToken', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload)
        });

        const data = await response.json();
        if (!response.ok || !data.success || !data.iframeUrl) {
          throw new Error(data.message || 'PayTR ödeme servisi yanıt vermedi.');
        }

        // PayTR iframe alanını yükle
        const container = document.getElementById('paytr-container');
        const wrapper = document.getElementById('paytr-iframe-wrapper');
        wrapper.innerHTML = '';

        const iframe = document.createElement('iframe');
        iframe.src = data.iframeUrl;
        iframe.id = 'paytriframe';
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('scrolling', 'no');
        iframe.setAttribute('title', 'PayTR Güvenli Ödeme');
        iframe.style.width = '100%';
        iframe.style.minHeight = '520px';
        iframe.style.border = 'none';
        iframe.style.borderRadius = '8px';

        wrapper.appendChild(iframe);
        container.style.display = 'block';
        btn.style.display = 'none';
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // PayTR Dinamik Boyutlandırma Dinleyicisi
        window.addEventListener('message', (event) => {
          if (event.origin !== 'https://www.paytr.com') return;
          try {
            const msgData = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            const height = Number.parseInt(msgData?.height, 10);
            if (Number.isFinite(height) && height >= 300 && height <= 2400) {
              iframe.style.height = `${height + 20}px`;
            }
          } catch (_) {}
        });

      } catch (err) {
        console.error('VIP PayTR Hatası:', err);
        alert('Ödeme başlatılamadı: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
